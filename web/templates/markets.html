<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cpk market radar</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --muted:#6b7280; --text:#111; --accent:#2563eb; --good:#065f46; --goodbg:#ecfdf5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1e24; --line:#2a2f37; --muted:#9aa4b2; --text:#e5e7eb; --accent:#60a5fa; --good:#6ee7b7; --goodbg:#0f2a22; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  #status { margin:16px 0; font-size:14px; color:var(--muted); }
  .err { color:#b91c1c; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line);
          border-radius:10px; overflow:hidden; }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; }
  th { background:rgba(127,127,127,.08); color:var(--muted); font-weight:600; font-size:12px; white-space:nowrap; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tbody tr:last-child td { border-bottom:none; }
  .badge { font-size:11px; padding:2px 7px; border-radius:6px; background:rgba(127,127,127,.15); color:var(--muted); white-space:nowrap; }
  .badge.yes { background:var(--goodbg); color:var(--good); }
  .spark { vertical-align:middle; }
  .tablewrap { overflow-x:auto; }
  .muted { color:var(--muted); }
  .topnav { display:flex; gap:14px; align-items:center; margin-bottom:12px; font-size:13px; }
  .topnav a { color:var(--accent); text-decoration:none; }
  .topnav a:hover { text-decoration:underline; }
  .kwcell { min-width:180px; }
  .kw { font-weight:600; }
  .chips { margin-top:6px; }
  .chips details { margin-top:4px; }
  .chips summary { cursor:pointer; color:var(--muted); font-size:12px; list-style:none; user-select:none; }
  .chips summary::-webkit-details-marker { display:none; }
  .chips summary::before { content:"▸ "; }
  .chips details[open] summary::before { content:"▾ "; }
  .chiprow { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .chip { font-size:11px; padding:2px 7px; border-radius:999px; background:rgba(127,127,127,.12);
          color:var(--text); border:1px solid var(--line); white-space:nowrap; }
  .chip.auto { background:rgba(37,99,235,.08); }
  .grouplabel { font-size:11px; color:var(--muted); margin-top:6px; }
  .searchbar { display:flex; gap:8px; margin:14px 0 6px; flex-wrap:wrap; }
  .searchbar input { flex:1; min-width:180px; padding:10px 12px; font-size:14px; border:1px solid var(--line);
                     border-radius:8px; background:var(--card); color:var(--text); }
  .searchbar button { padding:10px 16px; font-size:14px; font-weight:600; border:none; border-radius:8px;
                      background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
  .searchbar button:disabled { opacity:.55; cursor:progress; }
  .hint { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .samplebadge { font-size:10px; font-weight:600; padding:1px 6px; border-radius:6px; margin-left:6px;
                 background:var(--warnbg); color:var(--warn); vertical-align:middle; }
  :root { --warnbg:#fef3c7; --warn:#92400e; }
  @media (prefers-color-scheme: dark) { :root { --warnbg:#2a230f; --warn:#fcd34d; } }
  .chip.clickable { cursor:pointer; }
  .chip.clickable:hover, .chip.clickable:focus { background:var(--accent); color:#fff; border-color:var(--accent); outline:none; }
  .kw.clickable { cursor:pointer; }
  .kw.clickable:hover { color:var(--accent); text-decoration:underline; }
  #detail { margin-top:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .detailcard h2 { font-size:16px; margin:0 0 4px; }
  .metrics { font-size:13px; color:var(--muted); margin:6px 0 10px; }
  .detailcard table { width:100%; border-collapse:collapse; margin-top:4px; }
  .detailcard th,.detailcard td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); font-size:13px; }
  .detailcard th { color:var(--muted); font-weight:600; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="markets">cpk market radar — markets</h1>
  <div class="sub">market.db 에 쌓인 기회점수·경쟁·수요·꾸준함·도매꾹 현황을 읽기 전용으로 보여줍니다.</div>
  <div class="topnav"><a href="/guide">📖 지표 설명 (판단 가이드)</a></div>

  <form class="searchbar" id="collectForm" autocomplete="off">
    {% if password_required %}<input id="pw" type="password" placeholder="접근 비밀번호" autocomplete="off" aria-label="접근 비밀번호">{% endif %}
    <input id="q" type="text" placeholder="키워드 입력 후 수집 (예: 계란트레이)" maxlength="60" aria-label="수집할 키워드">
    <button id="collectBtn" type="submit">수집하기</button>
  </form>
  <div class="hint">검색하면 준비된 연관검색어·자동완성·상품부터 표시합니다. 도매꾹 정보는 조회가 끝나면 추가됩니다.</div>

  <div id="status">불러오는 중…</div>
  <div id="results"></div>
  <div id="detail"></div>
</div>

<script src="/static/jobs.js"></script>
<script>
const $ = (id) => document.getElementById(id);

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(n, digits){
  if (n === null || n === undefined) return "—";
  if (typeof n !== "number") return esc(n);
  return digits == null ? n.toLocaleString("ko-KR") : n.toFixed(digits);
}

function sparkline(points){
  const vals = (points||[]).map(p => (p && typeof p.review_sum === "number") ? p.review_sum : null).filter(v => v !== null);
  if (vals.length < 2) return '<span class="muted">—</span>';
  const w = 80, h = 22, pad = 2;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const step = (w - pad * 2) / (vals.length - 1);
  const xy = vals.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - ((v - min) / span) * (h - pad * 2);
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="추이">' +
    '<polyline fill="none" stroke="currentColor" stroke-width="1.5" points="'+esc(xy.join(" "))+'"/></svg>';
}

function chips(items, cls){
  // 클릭 가능: 클릭하면 그 키워드로 검색(검색창 입력 효과) → 하단 결과.
  return (items||[]).map(t =>
    '<span class="chip clickable'+(cls?(' '+cls):'')+'" role="button" tabindex="0" data-kw="'+esc(t)+
    '" title="클릭하면 이 키워드로 검색">'+esc(t)+'</span>').join("");
}

// 연관검색어/자동완성: 6개 이하면 바로, 많으면 펼치기/접기(details)로 전량 출력.
function chipGroup(label, items, cls){
  items = (items||[]).filter(t => t != null && String(t).trim() !== "");
  if (items.length === 0) return '<div class="grouplabel">'+esc(label)+' <span class="muted">없음</span></div>';
  if (items.length <= 6) {
    return '<div class="grouplabel">'+esc(label)+' '+esc(items.length)+'개</div>' +
           '<div class="chiprow">'+chips(items, cls)+'</div>';
  }
  return '<details><summary>'+esc(label)+' '+esc(items.length)+'개 펼치기</summary>' +
         '<div class="chiprow">'+chips(items, cls)+'</div></details>';
}

function domeBadge(m){
  if (m.dome_exists) {
    const cnt = (m.dome_count === null || m.dome_count === undefined) ? "" : (" " + esc(num(m.dome_count)));
    return '<span class="badge yes">있음' + cnt + '</span>';
  }
  return '<span class="badge">없음</span>';
}

function render(data){
  const markets = data.markets || [];
  if (!data.error) { window.__report = data; }

  if (data.error) {
    $("status").innerHTML = '<span class="err">'+esc(data.message || "데이터를 가져오지 못했어요.")+'</span>';
    $("results").innerHTML = "";
    return;
  }
  if (markets.length === 0) {
    $("status").innerHTML = esc("아직 수집된 데이터가 없습니다.");
    $("results").innerHTML = "";
    return;
  }

  $("status").innerHTML = '<span class="muted">'+esc(markets.length)+'개 키워드'+
    (data.generated ? ' · 생성 ' + esc(data.generated) : '')+'</span>';

  let html = '<div class="tablewrap"><table><thead><tr>' +
    '<th>키워드</th><th class="num">기회점수</th><th class="num">경쟁</th><th class="num">수요</th>' +
    '<th class="num">꾸준함</th><th>도매꾹</th><th class="num">최신 리뷰합</th><th class="num">최신 중앙가</th><th>추이</th>' +
    '</tr></thead><tbody>';

  markets.forEach(m => {
    const latest = m.latest || {};
    const sampleTag = m.sample ? '<span class="samplebadge">샘플</span>' : '';
    const kwcell = '<div class="kw clickable" role="button" tabindex="0" data-kw="'+esc(m.keyword)+
      '" title="클릭하면 이 키워드로 검색">'+esc(m.keyword)+sampleTag+'</div>' +
      '<div class="chips">' +
        chipGroup("연관검색어", m.related, "") +
        (m.autocomplete_ok === 0 ? '<div class="grouplabel">자동완성 · 조회 실패</div>' : chipGroup("자동완성", m.autocomplete, "auto")) +
      '</div>';
    html += '<tr>' +
      '<td class="kwcell">'+kwcell+'</td>' +
      '<td class="num">'+num(m.opportunity, 3)+'</td>' +
      '<td class="num">'+num(m.rarity, 3)+'</td>' +
      '<td class="num">'+num(m.demand, 3)+'</td>' +
      '<td class="num">'+num(m.steadiness, 3)+'</td>' +
      '<td>'+domeBadge(m)+'</td>' +
      '<td class="num">'+num(latest.review_sum)+'</td>' +
      '<td class="num">'+num(latest.price_med)+'</td>' +
      '<td>'+sparkline(m.trend)+'</td>' +
      '</tr>';
  });
  html += '</tbody></table></div>';
  $("results").innerHTML = html;
  if (window.__lastSearch) { renderDetail(window.__lastSearch); }
}

// 하단 '검색 결과' 패널: 해당 키워드의 점수·도매꾹·상위 상품·연관/자동완성(클릭 가능)을 보여준다.
function renderDetail(kw){
  const d = $("detail");
  const m = (window.__report && window.__report.markets || []).find(x => x.keyword === kw);
  if (!m) { d.innerHTML = ""; return; }
  const top = (m.top || []).slice(0, 10);
  const rows = top.map(it =>
    '<tr><td>'+esc(it.badge||'')+'</td><td>'+esc(it.name||'')+'</td>' +
    '<td class="num">'+num(it.price)+'</td><td class="num">'+num(it.reviews)+'</td></tr>').join("");
  const dome = m.dome_exists == null ? '미확인' : m.dome_exists ? ('있음 '+num(m.dome_count)) : '없음';
  d.innerHTML = '<div class="card detailcard">' +
    '<h2>검색 결과 · '+esc(m.keyword)+(m.sample?' <span class="samplebadge">샘플</span>':'')+'</h2>' +
    '<div class="metrics">기회 '+num(m.opportunity,3)+' · 경쟁 '+num(m.rarity,3)+
      ' · 수요 '+num(m.demand,3)+' · 꾸준함 '+num(m.steadiness,3)+' · 도매꾹 '+dome+'</div>' +
    (rows ? ('<div class="tablewrap"><table><thead><tr><th>배지</th><th>상품명</th>' +
      '<th class="num">가격</th><th class="num">리뷰</th></tr></thead><tbody>'+rows+'</tbody></table></div>')
      : '<div class="muted">상위 상품 정보가 없습니다.</div>') +
    '<div class="chips">' + chipGroup("연관검색어", m.related, "") +
      (m.autocomplete_ok === 0 ? '<div class="grouplabel">자동완성 · 조회 실패</div>' : chipGroup("자동완성", m.autocomplete, "auto")) + '</div>' +
    '</div>';
}

// 클릭·입력 공통 진입: 이미 수집된 키워드면 즉시 하단 표시, 새 키워드면 수집 후 표시.
async function doSearch(kw){
  kw = (kw || "").trim();
  if (!kw) return;
  $("q").value = kw;
  window.__lastSearch = kw;
  const existing = (window.__report && window.__report.markets || []).find(x => x.keyword === kw);
  if (existing) {
    if (window.__searchController) window.__searchController.abort();
    window.__searchVersion = (window.__searchVersion || 0) + 1;
    $("collectBtn").disabled = false;
    $("collectBtn").textContent = "수집하기";
    renderDetail(kw);
    $("detail").scrollIntoView({behavior: "smooth", block: "start"});
    return;
  }
  await collect(kw);  // 새 키워드는 수집(검색) 후 하단 표시
  $("detail").scrollIntoView({behavior: "smooth", block: "start"});
}

async function load(){
  const version = window.__searchVersion || 0;
  try {
    const res = await fetch("/api/markets");
    const data = await res.json();
    if ((window.__searchVersion || 0) === version) render(data);
  } catch (e) {
    $("status").innerHTML = '<span class="err">연결 오류가 발생했어요. 다시 시도해 주세요.</span>';
  }
}

async function collect(q){
  if (window.__searchController) window.__searchController.abort();
  const controller = new AbortController();
  window.__searchController = controller;
  const version = (window.__searchVersion || 0) + 1;
  window.__searchVersion = version;
  const btn = $("collectBtn");
  btn.disabled = true;
  btn.textContent = "수집 중…";
  window.__lastSearch = q;
  $("status").textContent = '"'+q+'" 검색을 시작합니다…';
  $("detail").innerHTML = '<div class="card"><span class="muted">"'+esc(q)+'" 검색 중…</span></div>';
  try {
    await cpkJobs.search(q, {password: $("pw")?.value || "", signal: controller.signal,
      onUpdate(job) {
        if (window.__searchVersion !== version) return;
        if (job.report) render(job.report);
        renderJob(job);
      }});
  } catch (e) {
    if (e.name !== "AbortError" && window.__searchVersion === version)
      $("status").innerHTML = '<span class="err">'+esc(e.message)+'</span>';
  } finally {
    if (window.__searchVersion === version) {
      btn.disabled = false;
      btn.textContent = "수집하기";
    }
  }
}

function renderJob(job) {
  const sections = job.sections || {};
  const labels = cpkJobs.labels;
  const state = name => labels[sections[name]] || "조회 실패";
  const prefix = job.state === "queued" ? "검색 대기 · " :
    job.state === "complete" ? "수집 완료 · " : ["partial", "failed"].includes(job.state) ? "일부 조회 실패 · " : "";
  $("status").textContent = prefix + "검색 " + state("search") + " · 자동완성 " + state("autocomplete") + " · 도매꾹 " + state("sourcing");
  const result = job.result || {};
  const group = (label, name, values, cls) => sections[name] === "ok" ? chipGroup(label, values, cls) :
    '<div class="grouplabel">'+esc(label)+' <span class="muted">'+esc(state(name))+'</span></div>';
  const items = (result.items || []).slice(0, 10);
  const rows = items.map(it => '<tr><td>'+esc(it.badge)+'</td><td>'+esc(it.name)+'</td><td>'+num(it.price)+'</td><td>'+num(it.reviews)+'</td></tr>').join("");
  const source = sections.sourcing === "ok" ? (job.sourcing.exists ? "있음 " + num(job.sourcing.count) : "없음") : state("sourcing");
  $("detail").innerHTML = '<div class="card detailcard"><h2>검색 결과 · '+esc(job.query)+'</h2>' +
    '<div class="chips">'+group("연관검색어", "search", result.related_keywords, "")+
    group("자동완성", "autocomplete", job.autocomplete?.items, "auto")+'</div>' +
    '<div class="metrics">도매꾹 '+esc(source)+'</div>'+
    (rows ? '<table><thead><tr><th>배지</th><th>상품명</th><th>가격</th><th>리뷰</th></tr></thead><tbody>'+rows+'</tbody></table>' :
      '<div class="muted">상품 '+esc(state("search"))+'</div>')+'</div>';
}

// 키워드/칩 클릭·키보드로 검색 (이벤트 위임: 표와 하단 패널 모두 적용).
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-kw]");
  if (el && el.dataset.kw) { doSearch(el.dataset.kw); }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest && e.target.closest("[data-kw]");
  if (el && el.dataset.kw) { e.preventDefault(); doSearch(el.dataset.kw); }
});

$("collectForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q) { window.__lastSearch = q; collect(q); }  // 검색창은 항상 새로 수집(검색)
});

load();
</script>
</body>
</html>
