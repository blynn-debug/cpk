# cpk 도구 설정. 패키징이 아니라 린트/포맷 기준을 담는다(구조는 평면 유지).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "state", "data", "docs"]

[tool.ruff.lint]
# 실제 버그(F=pyflakes: 미사용/미정의), 임포트 정렬(I), 흔한 함정(B), 업그레이드 제안(UP).
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
  "E501",   # 줄 길이는 강제하지 않음(기존 코드에 긴 줄 존재)
  "B008",   # 기본 인자에서 함수 호출(의도적 패턴 있음)
  "UP038",  # isinstance 튜플 형태 유지
]

[tool.ruff.format]
quote-style = "double"
